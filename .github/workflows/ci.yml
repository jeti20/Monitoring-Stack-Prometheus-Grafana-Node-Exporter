---
name: CI

on: [push, pull_request]

jobs:
  validate-prometheus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Prometheus
        run: |
          wget https://github.com/prometheus/prometheus/releases/download/v3.4.0/prometheus-3.4.0.linux-amd64.tar.gz
          tar xvf prometheus-3.4.0.linux-amd64.tar.gz
          sudo mv prometheus-3.4.0.linux-amd64/promtool /usr/local/bin/

      - name: Validate prometheus.yml
        run: promtool check config Prometheus/prometheus.yml

      - name: Validate alert rules
        run: promtool check rules Prometheus/rules/*.yml

  validate-alertmanager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Alertmanager
        run: |
          wget https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz
          tar xvf alertmanager-0.28.1.linux-amd64.tar.gz
          sudo mv alertmanager-0.28.1.linux-amd64/amtool /usr/local/bin/

      - name: Validate alertmanager.yml
        run: amtool check-config alertmanager/alertmanager.yml

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML syntax
        run: |
          yamllint Prometheus/prometheus.yml \
                   Prometheus/rules/*.yml \
                   alertmanager/alertmanager.yml \
                   grafana/provisioning/datasources/prometheus.yml \
                   grafana/provisioning/dashboards/dashboard.yml
