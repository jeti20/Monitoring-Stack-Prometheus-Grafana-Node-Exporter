name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Prometheus
        run: |
          wget https://github.com/prometheus/prometheus/releases/download/v3.4.0/prometheus-3.4.0.linux-amd64.tar.gz
          tar xvf prometheus-3.4.0.linux-amd64.tar.gz
          sudo mv prometheus-3.4.0.linux-amd64/promtool /usr/local/bin/

      - name: Validate prometheus.yml
        run: promtool check config Prometheus/prometheus.yml

      - name: Validate alert rules
        run: promtool check rules Prometheus/rules/*.yml
