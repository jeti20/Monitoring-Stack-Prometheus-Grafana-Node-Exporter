---
server:
  # Port HTTP Promtaila — status i metryki wewnętrzne
  http_listen_port: 9080

positions:
  # Promtail zapamiętuje tu dokąd doczytał każdy plik logów
  # Używamy /var/lib/promtail żeby przetrwać restart (nie /tmp)
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  # --- Logi systemowe z /var/log ---
  # Zbiera syslog, auth.log, kern.log itp.
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log

  # --- Logi z journald (usługi systemd) ---
  # Dzięki temu widzisz logi prometheus, loki itp. bez odczytywania plików
  - job_name: journal
    journal:
      max_age: 12h
      labels:
        job: journal
    relabel_configs:
      # Nazwa unit systemd jako label — np. "prometheus.service"
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      # Priorytet wiadomości (0=emerg … 7=debug)
      - source_labels: ['__journal_priority_keyword']
        target_label: level
